name: Installation and syntax
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m compileall -q .
      - run: |
          for entry in download_sources prepare_data prepare_critical train classifier evaluate evaluate_classifier calibrate_window benchmark_nominal benchmark_classifier benchmark_window evaluate_public summarize plot_examples compare_optics verify run_all; do
            python "$entry.py" --help > /dev/null
          done
